services:
  - type: web
    name: nmig-material-harmonizer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000
